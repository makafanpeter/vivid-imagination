name: CI/CD

on:
  push:
    branches: [main, develop, "feature/*", "chore/*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write
  pull-requests: read

env:
  OWNER: ${{ github.repository_owner }}
  APP_VERSION: "1.0"          # bump to "1.1", "2.0" etc. for major/minor releases

jobs:
  # ── Detect changed services ────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api:     ${{ steps.filter.outputs.api }}
      tests:   ${{ steps.filter.outputs.tests }}
      mobile:  ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/backend/**'
              - 'docker-compose*.yml'
              - 'Directory.Build.props'
              - 'VividImagination.slnx'
              - '.github/workflows/ci-cd.yml'
            tests:
              - 'tests/**'
            mobile:
              - 'src/mobile/**'
              - '.github/workflows/ci-cd.yml'

  # ── Backend: unit & architecture tests ─────────────────────────────────────
  test-backend:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: |
          dotnet restore src/backend/Host/VividImagination.Api/VividImagination.Api.csproj
          dotnet restore tests/VividImagination.UnitTests/VividImagination.UnitTests.csproj
          dotnet restore tests/VividImagination.ArchitectureTests/VividImagination.ArchitectureTests.csproj

      - name: Build backend & test suites
        run: |
          dotnet build src/backend/Host/VividImagination.Api/VividImagination.Api.csproj --no-restore -c Release
          dotnet build tests/VividImagination.UnitTests/VividImagination.UnitTests.csproj --no-restore -c Release
          dotnet build tests/VividImagination.ArchitectureTests/VividImagination.ArchitectureTests.csproj --no-restore -c Release

      - name: Run Unit Tests
        run: dotnet test tests/VividImagination.UnitTests/VividImagination.UnitTests.csproj --no-build -c Release --verbosity normal --logger "trx;LogFileName=unit-tests.trx"

      - name: Run Architecture Tests
        run: dotnet test tests/VividImagination.ArchitectureTests/VividImagination.ArchitectureTests.csproj --no-build -c Release --verbosity normal --logger "trx;LogFileName=arch-tests.trx"

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/test-results/*.trx'

  # ── Mobile: Android Build ──────────────────────────────────────────────────
  build-mobile-android:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.mobile == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Restore Mobile Dependencies
        run: dotnet restore src/mobile/VividImagination.Mobile/VividImagination.Mobile.csproj -p:TargetFramework=net10.0-android

      - name: Build Android App (Release)
        run: dotnet build src/mobile/VividImagination.Mobile/VividImagination.Mobile.csproj -c Release -f net10.0-android --no-restore

      - name: Upload Android Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivid-imagination-mobile-android
          path: |
            src/mobile/VividImagination.Mobile/bin/Release/net10.0-android/*Signed.apk
            src/mobile/VividImagination.Mobile/bin/Release/net10.0-android/*.apk
            src/mobile/VividImagination.Mobile/bin/Release/net10.0-android/*.aab

  # ── Build & push Docker images to GHCR ─────────────────────────────────────
  build:
    needs: [changes, test-backend]
    runs-on: ubuntu-latest
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.api == 'true' }}
    outputs:
      image_tag:   ${{ steps.resolve_tag.outputs.image_tag }}
      push_latest: ${{ steps.resolve_tag.outputs.push_latest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: resolve_tag
        run: |
          RUN="${{ github.run_number }}"
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "main" ]]; then
            echo "image_tag=${{ env.APP_VERSION }}.${RUN}" >> $GITHUB_OUTPUT
            echo "push_latest=true"                        >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "develop" ]]; then
            echo "image_tag=develop-${RUN}"               >> $GITHUB_OUTPUT
            echo "push_latest=true"                        >> $GITHUB_OUTPUT
          else
            SLUG=$(echo "$BRANCH" | sed 's/\//-/g')
            echo "image_tag=${SLUG}-${RUN}"               >> $GITHUB_OUTPUT
            echo "push_latest=false"                       >> $GITHUB_OUTPUT
          fi

      - name: Build API image
        run: |
          docker build -f src/backend/Host/VividImagination.Api/Dockerfile -t vividimagination.backend.api:latest .

      - name: Push API image
        run: |
          OWNER_LC=$(echo "${{ env.OWNER }}" | tr '[:upper:]' '[:lower:]')
          TAG="ghcr.io/${OWNER_LC}/vividimagination.backend.api:${{ steps.resolve_tag.outputs.image_tag }}"
          docker tag vividimagination.backend.api:latest "$TAG"
          docker push "$TAG"
          if [[ "${{ steps.resolve_tag.outputs.push_latest }}" == "true" ]]; then
            LATEST="ghcr.io/${OWNER_LC}/vividimagination.backend.api:latest"
            docker tag vividimagination.backend.api:latest "$LATEST"
            docker push "$LATEST"
          fi

  # ── Deploy to sandbox (develop branch only) ────────────────────────────────
  deploy:
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' && github.ref_name == 'develop' && github.event_name == 'push' }}
    concurrency:
      group: deploy-sandbox
      cancel-in-progress: false
    steps:
      - name: Build service list
        id: svclist
        run: |
          echo "services=vividimagination.backend.api" >> $GITHUB_OUTPUT

      - name: Install cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] \
            https://pkg.cloudflare.com/cloudflared any main" \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update && sudo apt-get install -y cloudflared

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Test service token auth
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl -v https://${{ secrets.SANDBOX_SSH_HOST }} \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"

      - name: Open Cloudflare TCP tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cloudflared access tcp \
          --hostname ${{ secrets.SANDBOX_SSH_HOST }} \
          --url localhost:2222 \
          --id ${{ secrets.CF_ACCESS_CLIENT_ID }} \
          --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }} &
          sleep 3  # wait for listener to be ready

      - name: Configure SSH through local listener
        run: |
          cat >> ~/.ssh/config <<EOF
          Host sandbox-tunnel
            HostName localhost
            Port 2222
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            User ${{ secrets.SANDBOX_DEPLOY_USER }}
          EOF

      - name: Deploy to sandbox
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh sandbox-tunnel \
            "GITHUB_TOKEN=${{ secrets.GHCR_READ_TOKEN }} \
             deploy-app --dir /home/peter/vividimagination-compose \
                        --project vividimagination-app \
                        --tag ${{ needs.build.outputs.image_tag }} \
                        ${{ steps.svclist.outputs.services }}"
