AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Vivid Imagination - Production .NET 10 Modular Monolith deployment to Amazon EC2 (m7i-flex.large)
  behind Cloudflare Tunnel with zero open inbound ports, private GHCR integration, S3 photo storage,
  Amazon Rekognition AI moderation, and automated Docker Compose bootstrapping with unified .env.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    Description: Environment stage (production, staging, sandbox)

  InstanceType:
    Type: String
    Default: m7i-flex.large
    AllowedValues:
      - m7i-flex.large
      - m7i.large
      - m7i.xlarge
      - t3.large
      - t3.xlarge
      - c7i.large
      - m6i.large
    Description: EC2 instance type (m7i-flex.large recommended for 2 vCPU / 8 GB RAM)

  VolumeSize:
    Type: Number
    Default: 50
    MinValue: 30
    MaxValue: 500
    Description: Root EBS GP3 volume storage in GB

  CloudflareCertPem:
    Type: String
    NoEcho: true
    Description: Contents of ~/.cloudflared/cert.pem generated via 'cloudflared tunnel login' to automate tunnel creation and DNS routing

  GhcrUsername:
    Type: String
    Description: GitHub username for authenticating to GitHub Container Registry (ghcr.io)

  GhcrToken:
    Type: String
    NoEcho: true
    Description: GitHub Personal Access Token (PAT) with read:packages scope to pull private images

  GhcrImageRepository:
    Type: String
    Default: ghcr.io/your-username/vividimagination.backend.api
    Description: Target container image repository in GHCR

  AppImageTag:
    Type: String
    Default: latest
    Description: Initial container image tag to deploy

  PostgresUser:
    Type: String
    Default: vivid_user
    Description: PostgreSQL administrative username

  PostgresPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: PostgreSQL administrative password

  PostgresDb:
    Type: String
    Default: vivid_imagination
    Description: PostgreSQL primary database name

  JwtSecretKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret key for JWT and application signing (min 32 characters)

  EncryptionKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Symmetric encryption key for data protection (min 32 characters)

  AppBaseUrl:
    Type: String
    Default: https://api.yourdomain.com
    Description: Public HTTPS URL routed via Cloudflare to this application

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Parameter Store path to latest Amazon Linux 2023 AMI

  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 Key Pair for SSH fallback (leave blank to rely on SSM Session Manager & Cloudflare Access)

  SshPublicKey:
    Type: String
    Default: ""
    Description: Optional SSH public key (e.g. ssh-ed25519 or ssh-rsa) to authorize for ec2-user SSH deploy access

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  # ============================================================================
  # 1. NETWORKING (VPC, Subnet, Route Table, Internet Gateway)
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vivid-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vivid-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vivid-public-subnet"

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vivid-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # ============================================================================
  # 2. SECURITY GROUP (Zero-Inbound for Cloudflare Tunnel)
  # ============================================================================
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Vivid Imagination EC2 instance (Zero Ingress, Outbound Only for Cloudflare Tunnel)
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - Description: Allow all outbound traffic (Cloudflare Tunnel, S3, Rekognition, GHCR)
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vivid-sg"

  # ============================================================================
  # 3. STORAGE (S3 Photo Bucket)
  # ============================================================================
  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "vivid-photos-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
              - DELETE
            AllowedOrigins:
              - !Ref AppBaseUrl
              - "https://*.pages.dev"
            MaxAge: 3600
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vivid-photos"

  # ============================================================================
  # 4. IAM ROLES & POLICIES (S3, Rekognition, Systems Manager)
  # ============================================================================
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: VividPhotoS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt PhotoBucket.Arn
                  - !Sub "${PhotoBucket.Arn}/*"
        - PolicyName: VividRekognitionModerationAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rekognition:DetectModerationLabels
                  - rekognition:DetectLabels
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vivid-ec2-role"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # ============================================================================
  # 5. EC2 INSTANCE & BOOTSTRAP (Amazon Linux 2023, Docker, cloudflared, Compose)
  # ============================================================================
  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn: PublicRoute
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
        Count: 1
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref EC2InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          SubnetId: !Ref PublicSubnet
          GroupSet:
            - !Ref EC2SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            Iops: 3000
            #Throughput: 125
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vivid-app"
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -xeou pipefail
          exec > >(tee -a /var/log/vivid-bootstrap.log) 2>&1

          trap 'signal_cfn $?' EXIT

          signal_cfn() {
            STATUS="SUCCESS"
            if [ "$1" -ne 0 ]; then
              STATUS="FAILURE"
            fi
            /opt/aws/bin/cfn-signal -e $1 --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region} || true
          }

          echo "=== 1. Update OS and Install Prerequisites ==="
          dnf update -y
          dnf install -y --allowerasing docker git jq gzip

          dnf install -y python3-pip
          pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz || true

          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -SL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose

          systemctl start docker
          systemctl enable docker
          usermod -aG docker ec2-user

          if [ -n "${SshPublicKey}" ]; then
            mkdir -p /home/ec2-user/.ssh
            echo "${SshPublicKey}" >> /home/ec2-user/.ssh/authorized_keys
            chmod 700 /home/ec2-user/.ssh
            chmod 600 /home/ec2-user/.ssh/authorized_keys
            chown -R ec2-user:ec2-user /home/ec2-user/.ssh
          fi

          echo "=== 2. Install and Configure Cloudflare Tunnel (Host Native + Config File) ==="
          curl -fsSL -o /tmp/cloudflared.rpm "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-x86_64.rpm"
          dnf install -y --allowerasing /tmp/cloudflared.rpm
          rm -f /tmp/cloudflared.rpm

          APP_HOST=$(echo "${AppBaseUrl}" | sed -e 's|^[^/]*//||' -e 's|/.*$||')

          mkdir -p /etc/cloudflared
          cat <<'EOF_CERT' > /etc/cloudflared/cert.pem
          ${CloudflareCertPem}
          EOF_CERT
          python3 -c "p='/etc/cloudflared/cert.pem'; d=open(p).read().replace(r'\n','\n').replace('\r','').strip()+'\n'; open(p,'w').write(d)"
          chmod 600 /etc/cloudflared/cert.pem

          TUNNEL_NAME="${EnvironmentName}-vivid-tunnel"

          CREATE_OUT=$(cloudflared tunnel --origincert /etc/cloudflared/cert.pem create "$TUNNEL_NAME" 2>&1 || true)
          TUNNEL_ID=$(echo "$CREATE_OUT" | grep -oE '[a-f0-9-]{36}' | head -1 || true)

          if [ -z "$TUNNEL_ID" ]; then
            echo "Tunnel $TUNNEL_NAME may already exist. Cleaning up and recreating..."
            cloudflared tunnel --origincert /etc/cloudflared/cert.pem delete -f "$TUNNEL_NAME" 2>/dev/null || true
            CREATE_OUT=$(cloudflared tunnel --origincert /etc/cloudflared/cert.pem create "$TUNNEL_NAME" 2>&1 || true)
            TUNNEL_ID=$(echo "$CREATE_OUT" | grep -oE '[a-f0-9-]{36}' | head -1 || true)
          fi

          echo "Tunnel provisioned with ID: $TUNNEL_ID"

          if [ -n "$TUNNEL_ID" ] && [ -f "/root/.cloudflared/$TUNNEL_ID.json" ]; then
            cp -f "/root/.cloudflared/$TUNNEL_ID.json" "/etc/cloudflared/$TUNNEL_ID.json"
          fi
          if [ -n "$TUNNEL_ID" ] && [ -f "/etc/cloudflared/$TUNNEL_ID.json" ]; then
            chmod 600 "/etc/cloudflared/$TUNNEL_ID.json"
          fi

          echo "Configuring DNS routes in Cloudflare for $APP_HOST and ssh-$APP_HOST..."
          cloudflared tunnel --origincert /etc/cloudflared/cert.pem route dns -f "$TUNNEL_NAME" "$APP_HOST" || true
          cloudflared tunnel --origincert /etc/cloudflared/cert.pem route dns -f "$TUNNEL_NAME" "ssh-$APP_HOST" || true

          cat <<EOF_CF_CONFIG > /etc/cloudflared/config.yml
          tunnel: $TUNNEL_ID
          credentials-file: /etc/cloudflared/$TUNNEL_ID.json
          ingress:
            - hostname: $APP_HOST
              service: http://127.0.0.1:8080
              originRequest:
                connectTimeout: 30s
                noTLSVerify: false
            - hostname: ssh-$APP_HOST
              service: ssh://127.0.0.1:22
            - service: http_status:404
          EOF_CF_CONFIG
          chmod 600 /etc/cloudflared/config.yml

          cat <<EOF_CF_SERVICE > /etc/systemd/system/cloudflared.service
          [Unit]
          Description=Cloudflare Tunnel Daemon
          After=network.target

          [Service]
          Type=notify
          ExecStart=/usr/bin/cloudflared --config /etc/cloudflared/config.yml tunnel run
          Restart=on-failure
          RestartSec=5s
          KillMode=mixed
          TimeoutStopSec=20s

          [Install]
          WantedBy=multi-user.target
          EOF_CF_SERVICE

          systemctl daemon-reload
          systemctl enable cloudflared
          systemctl start cloudflared

          echo "=== 3. Setup Vivid Imagination Directory & Config ==="
          APP_DIR="/opt/vivid-imagination"
          mkdir -p "$APP_DIR/scripts/postgres"

          cat <<'EOF_SQL' > "$APP_DIR/scripts/postgres/init-schemas.sql"
          -- Vivid Imagination Multi-Schema Initializer
          CREATE SCHEMA IF NOT EXISTS identity;
          CREATE SCHEMA IF NOT EXISTS media;
          CREATE SCHEMA IF NOT EXISTS social;
          EOF_SQL

          # Write Base Environment Configuration from infra/.env (gzipped base64)
          cat <<'EOF_GZ_ENV' | base64 -d | gzip -d > "$APP_DIR/.env"
          
          EOF_GZ_ENV

          # Inject Dynamic CloudFormation Parameters into .env
          sed -i "s|^API_IMAGE=.*|API_IMAGE=${GhcrImageRepository}|" "$APP_DIR/.env"
          sed -i "s|^APP_TAG=.*|APP_TAG=${AppImageTag}|" "$APP_DIR/.env"
          sed -i "s|^ASPNETCORE_ENVIRONMENT=.*|ASPNETCORE_ENVIRONMENT=Production|" "$APP_DIR/.env"
          sed -i "s|^POSTGRES_USER=.*|POSTGRES_USER=${PostgresUser}|" "$APP_DIR/.env"
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${PostgresPassword}|" "$APP_DIR/.env"
          sed -i "s|^POSTGRES_DB=.*|POSTGRES_DB=${PostgresDb}|" "$APP_DIR/.env"
          sed -i "s|^GHCR_USERNAME=.*|GHCR_USERNAME=${GhcrUsername}|" "$APP_DIR/.env"
          sed -i "s|^GHCR_TOKEN=.*|GHCR_TOKEN=${GhcrToken}|" "$APP_DIR/.env"
          sed -i "s|^AWS__Region=.*|AWS__Region=${AWS::Region}|" "$APP_DIR/.env"
          sed -i "s|^AWS__Bucket=.*|AWS__Bucket=${PhotoBucket}|" "$APP_DIR/.env"
          sed -i "s|^ApplicationSettings__General__PublicBucket=.*|ApplicationSettings__General__PublicBucket=${PhotoBucket}|" "$APP_DIR/.env"
          sed -i "s|^ApplicationSettings__General__StorageType=.*|ApplicationSettings__General__StorageType=S3|" "$APP_DIR/.env"
          sed -i "s|^ApplicationSettings__General__SecretKey=.*|ApplicationSettings__General__SecretKey=${JwtSecretKey}|" "$APP_DIR/.env"
          sed -i "s|^ApplicationSettings__General__EncryptionKey=.*|ApplicationSettings__General__EncryptionKey=${EncryptionKey}|" "$APP_DIR/.env"
          sed -i "s|^ApplicationSettings__OpenIdConnectSettings__Authority=.*|ApplicationSettings__OpenIdConnectSettings__Authority=${AppBaseUrl}|" "$APP_DIR/.env"
          sed -i "s|^ApplicationSettings__OpenIdConnectSettings__IssuerUri=.*|ApplicationSettings__OpenIdConnectSettings__IssuerUri=${AppBaseUrl}|" "$APP_DIR/.env"
          sed -i "s|postgres:mysecretpassword|${PostgresUser}:${PostgresPassword}|g" "$APP_DIR/.env"
          sed -i "s|^ApplicationSettings__Storage__S3__Region=.*|ApplicationSettings__Storage__S3__Region=${AWS::Region}|" "$APP_DIR/.env"
          sed -i "s|^ApplicationSettings__Storage__S3__BucketName=.*|ApplicationSettings__Storage__S3__BucketName=${PhotoBucket}|" "$APP_DIR/.env"
          chmod 600 "$APP_DIR/.env"

          # Write Production Docker Compose File (gzipped base64)
          cat <<'EOF_GZ_COMPOSE' | base64 -d | gzip -d > "$APP_DIR/docker-compose.prod.yml"
          
          EOF_GZ_COMPOSE
          chmod 644 "$APP_DIR/docker-compose.prod.yml"
          chown -R ec2-user:ec2-user "$APP_DIR"
          chmod 755 "$APP_DIR"
          chmod 600 "$APP_DIR/.env"

          echo "=== 4. Install deploy-app Helper Script ==="
          cat <<'EOF_GZ_DEPLOY' | base64 -d | gzip -d > /usr/local/bin/deploy-app
          
          EOF_GZ_DEPLOY
          chmod +x /usr/local/bin/deploy-app

          # Pre-create and set permissions on DataProtection volume (UID 1654)
          docker volume create vivid-imagination_api_dataprotection || true
          chown -R 1654:1654 /var/lib/docker/volumes/*dataprotection*/_data || true
          chmod -R 770 /var/lib/docker/volumes/*dataprotection*/_data || true

          echo "=== 5. Authenticate GHCR and Launch Stack ==="
          cd "$APP_DIR"
          if [[ -n "${GhcrToken}" ]]; then
            echo "${GhcrToken}" | docker login ghcr.io -u "${GhcrUsername}" --password-stdin || echo "Warning: Docker login to GHCR failed. Proceeding..."
          fi

          docker compose -f docker-compose.prod.yml pull || true

          cat <<EOF_SERVICE > /etc/systemd/system/vivid-imagination.service
          [Unit]
          Description=Vivid Imagination Docker Compose Stack
          Requires=docker.service
          After=docker.service network.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/vivid-imagination
          ExecStart=/usr/local/bin/docker-compose -f docker-compose.prod.yml up -d
          ExecStop=/usr/local/bin/docker-compose -f docker-compose.prod.yml down

          [Install]
          WantedBy=multi-user.target
          EOF_SERVICE

          systemctl daemon-reload
          systemctl enable vivid-imagination
          systemctl start vivid-imagination

          echo "=== Stack successfully initialized! ==="

Outputs:
  VpcId:
    Description: ID of the created VPC
    Value: !Ref VPC

  PublicSubnetId:
    Description: ID of the public subnet
    Value: !Ref PublicSubnet

  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2Instance

  PublicIp:
    Description: Public IP of the EC2 Instance (for reference or direct management if needed)
    Value: !GetAtt EC2Instance.PublicIp

  PhotoBucketName:
    Description: Amazon S3 bucket provisioned for photo uploads & transcoded variants
    Value: !Ref PhotoBucket

  PhotoBucketArn:
    Description: ARN of the Amazon S3 photo bucket
    Value: !GetAtt PhotoBucket.Arn

  SSMConnectCommand:
    Description: AWS CLI command to connect to EC2 via Systems Manager Session Manager
    Value: !Sub "aws ssm start-session --target ${EC2Instance} --region ${AWS::Region}"

  CloudflareTunnelVerification:
    Description: Expected local ingress target for Cloudflare Tunnel
    Value: "http://localhost:8080"
