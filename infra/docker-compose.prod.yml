services:
  postgres:
    image: postgres:16-alpine
    container_name: vivid-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vivid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-vivid_imagination}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vivid_user} -d ${POSTGRES_DB:-vivid_imagination}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: vivid-mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vivid-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: vivid-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vividimagination.backend.api:
    image: ${API_IMAGE:-ghcr.io/your-username/vividimagination.backend.api}:${APP_TAG:-latest}
    container_name: vivid-api
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - AllowedHosts=*
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=${POSTGRES_DB:-vivid_imagination};Username=${POSTGRES_USER:-vivid_user};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Identity=Host=postgres;Port=5432;Database=${POSTGRES_DB:-vivid_imagination};Username=${POSTGRES_USER:-vivid_user};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Social=Host=postgres;Port=5432;Database=${POSTGRES_DB:-vivid_imagination};Username=${POSTGRES_USER:-vivid_user};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Mongo=mongodb://mongodb:27017
      - MongoOptions__ConnectionString=mongodb://mongodb:27017
      - MongoOptions__DatabaseName=${POSTGRES_DB:-vivid_imagination}
      - Media__ConnectionString=mongodb://mongodb:27017
      - Media__DatabaseName=${POSTGRES_DB:-vivid_imagination}
      - Moderation__ConnectionString=mongodb://mongodb:27017
      - Moderation__DatabaseName=${POSTGRES_DB:-vivid_imagination}
      - Feed__ConnectionString=mongodb://mongodb:27017
      - Feed__DatabaseName=${POSTGRES_DB:-vivid_imagination}
      - ConnectionStrings__Redis=redis:6379
      - ApplicationSettings__Cache__ConnectionString=redis:6379
      - RabbitMQ__Enabled=true
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - ApplicationSettings__EventBus__RabbitMQ__Host=rabbitmq
      - ApplicationSettings__EventBus__RabbitMQ__Username=${RABBITMQ_USER:-guest}
      - ApplicationSettings__EventBus__RabbitMQ__Password=${RABBITMQ_PASSWORD:-guest}
      - AWS__Region=${AWS_REGION:-us-east-1}
      - AWS__Bucket=${AWS_S3_BUCKET}
      - ApplicationSettings__General__PublicBucket=${AWS_S3_BUCKET}
      - ApplicationSettings__General__StorageType=S3
      - ApplicationSettings__General__SecretKey=${JWT_SECRET_KEY}
      - ApplicationSettings__General__EncryptionKey=${ENCRYPTION_KEY}
      - ApplicationSettings__OpenIdConnectSettings__Authority=${APP_BASE_URL:-http://localhost:8080}
      - ApplicationSettings__OpenIdConnectSettings__IssuerUri=${APP_BASE_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - api_dataprotection:/app/App_Data/DataProtection
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  api_dataprotection:

networks:
  default:
    name: vivid-network
